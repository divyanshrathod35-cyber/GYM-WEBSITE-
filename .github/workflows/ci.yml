name: Body Tech website checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit checks
        run: npm test
      - name: Run typechecks
        run: npm run typecheck
      - name: Build production assets
        run: npm run build
      - name: Validate Windows deployment PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/repair-and-deploy.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify Vercel static Build Output API package
        run: node scripts/prepare-vercel-static.mjs
      - name: Run Chrome viewport acceptance
        shell: bash
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium is required for visual QA"
            exit 1
          fi
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/bodytech-preview.log 2>&1 &
          node scripts/ui-qa.mjs
      - name: Upload viewport screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodytech-v6-viewport-evidence
          path: evidence/v6/
          if-no-files-found: ignore
